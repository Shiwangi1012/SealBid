name: SealBid CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  contracts:
    name: Rust contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts -> target

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v22.0.0

      - name: Lint
        working-directory: contracts
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format check
        working-directory: contracts
        run: cargo fmt --all -- --check

      - name: Test
        working-directory: contracts
        run: cargo test --workspace

      - name: Build WASM (auction)
        working-directory: contracts
        run: cargo build --target wasm32-unknown-unknown --release -p auction

      - name: Build WASM (vault)
        working-directory: contracts
        run: cargo build --target wasm32-unknown-unknown --release -p vault

      - name: Build WASM (refund)
        working-directory: contracts
        run: cargo build --target wasm32-unknown-unknown --release -p refund

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: |
            contracts/target/wasm32-unknown-unknown/release/auction.wasm
            contracts/target/wasm32-unknown-unknown/release/vault.wasm
            contracts/target/wasm32-unknown-unknown/release/refund.wasm

  frontend:
    name: React frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_AUCTION_CONTRACT_ID: ${{ secrets.AUCTION_CONTRACT_ID || '' }}
          VITE_VAULT_CONTRACT_ID: ${{ secrets.VAULT_CONTRACT_ID || '' }}
          VITE_REFUND_CONTRACT_ID: ${{ secrets.REFUND_CONTRACT_ID || '' }}
          VITE_NATIVE_TOKEN_ID: ${{ secrets.NATIVE_TOKEN_ID || '' }}
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist

  deploy-vercel:
    name: Deploy to Vercel
    needs: frontend
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_AUCTION_CONTRACT_ID: ${{ secrets.AUCTION_CONTRACT_ID }}
          VITE_VAULT_CONTRACT_ID: ${{ secrets.VAULT_CONTRACT_ID }}
          VITE_REFUND_CONTRACT_ID: ${{ secrets.REFUND_CONTRACT_ID }}
          VITE_NATIVE_TOKEN_ID: ${{ secrets.NATIVE_TOKEN_ID }}
        run: npm run build

      - name: Check Vercel config
        id: vercel_config
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy
        if: steps.vercel_config.outputs.enabled == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          vercel-args: "--prod"

  deploy-testnet:
    name: Deploy to Stellar Testnet
    needs: [contracts, frontend]
    runs-on: ubuntu-latest
    environment: testnet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy secret
        id: deploy_config
        run: |
          if [ -n "$STELLAR_SECRET_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}

      - name: Install Rust
        if: steps.deploy_config.outputs.enabled == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install Stellar CLI
        if: steps.deploy_config.outputs.enabled == 'true'
        uses: stellar/stellar-cli@v22.0.0

      - name: Download WASM
        if: steps.deploy_config.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: wasm
          path: artifacts

      - name: Configure Stellar identity
        if: steps.deploy_config.outputs.enabled == 'true'
        run: |
          echo "${{ secrets.STELLAR_SECRET_KEY }}" | stellar keys add deployer --secret-key -

      - name: Deploy vault
        if: steps.deploy_config.outputs.enabled == 'true'
        working-directory: artifacts
        run: |
          ID=$(stellar contract deploy \
            --wasm vault.wasm \
            --source deployer \
            --network testnet)
          echo "VAULT_ID=$ID" >> $GITHUB_ENV
          echo "Vault contract deployed: $ID"
          echo "$ID" > vault_address.txt

      - name: Deploy refund
        if: steps.deploy_config.outputs.enabled == 'true'
        working-directory: artifacts
        run: |
          ID=$(stellar contract deploy \
            --wasm refund.wasm \
            --source deployer \
            --network testnet)
          echo "REFUND_ID=$ID" >> $GITHUB_ENV
          echo "Refund contract deployed: $ID"
          echo "$ID" > refund_address.txt

      - name: Deploy auction
        if: steps.deploy_config.outputs.enabled == 'true'
        working-directory: artifacts
        run: |
          ID=$(stellar contract deploy \
            --wasm auction.wasm \
            --source deployer \
            --network testnet)
          echo "AUCTION_ID=$ID" >> $GITHUB_ENV
          echo "Auction contract deployed: $ID"
          echo "$ID" > auction_address.txt

      - name: Upload deployment addresses
        if: steps.deploy_config.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deployment-addresses
          path: artifacts/*.txt
